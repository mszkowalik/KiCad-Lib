name: kicadlib-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kicadlib
      POSTGRES_PASSWORD: kicadlib
      POSTGRES_DB: kicadlib
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicadlib"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kicadlib}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kicadlib-secret}
    ports:
      - "127.0.0.1:9000:9000"
      # Web console
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    # Dev: auto-reload on host edits to api/app (paired with the app bind-mount below).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://kicadlib:kicadlib@db:5432/kicadlib
      REPO_DIR: /repo
      DATA_DIR: /data
      RENDER_MODE: http
      RENDER_URL: http://render:8100
      HTTPLIB_TOKEN: ${HTTPLIB_TOKEN:-dev-token}
      # Jaravis (the library agent) activates when this is set in .env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Projects module: object storage + git-token encryption key
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kicadlib}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kicadlib-secret}
      MINIO_BUCKET: kicadlib
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # JLCPCB OpenAPI — private parts library (consigned stock)
      JLC_APP_ID: ${JLC_APP_ID:-}
      JLC_ACCESS_KEY: ${JLC_ACCESS_KEY:-}
      JLC_SECRET_KEY: ${JLC_SECRET_KEY:-}
      # KiCad library nicknames as referenced by the live HTTP catalog —
      # defaults match the PCM install (PCM_7Sigma_Base / PCM_7Sigma)
      HTTPLIB_SYMBOL_LIB: ${HTTPLIB_SYMBOL_LIB:-PCM_7Sigma_Base}
      FOOTPRINT_LIB_NICKNAME: ${FOOTPRINT_LIB_NICKNAME:-PCM_7Sigma}
    volumes:
      # The existing library repo, mounted read-only — the import station reads from here.
      - ..:/repo:ro
      - apidata:/data
      # Dev: live-mount the app source so uvicorn --reload picks up host edits
      # without an image rebuild. uvicorn prepends /srv to sys.path, so the code
      # imported is this mount, not the copy baked into the image.
      - ./api/app:/srv/app
    ports:
      # host 8020 — 8000 is commonly taken by other local apps
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  render:
    build: ./render
    # kicad/kicad images are published amd64-only (no arm64 as of 10.0.x) —
    # on Apple Silicon this runs under Rosetta/QEMU emulation.
    platform: linux/amd64
    environment:
      # 3D board renders resolve ${SEVENSIGMA_DIR}/3DModels/... in the mirror
      SEVENSIGMA_DIR: /data/mirror
    volumes:
      - apidata:/data:ro
    ports:
      - "127.0.0.1:8100:8100"

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:8020
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  dbdata:
  apidata:
  miniodata:
