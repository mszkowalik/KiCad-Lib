[project]
name = "kicadlib-platform-api"
version = "0.1.0"
description = "Project Management Platform backend — Postgres-backed component library with versioning, approval gates, and KiCad HTTP-library endpoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.117",
    "pymupdf>=1.26",
    # Layout-aware markdown for the per-page datasheet index. Same engine and
    # same Artifex dual licence as pymupdf above, so it adds no new licence
    # question; it does pull onnxruntime (MIT) for its OCR-decision model.
    "pymupdf4llm>=1.28",
    "minio>=7.2",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    # Password hashing for the login page. argon2id is the current OWASP
    # recommendation and the wheel needs no compiler on linux/amd64.
    "argon2-cffi>=23.1",
    # 2D field solver (app/services/fieldsolver): FEM over a Triangle mesh.
    # NOTE ON LICENCE: `triangle` wraps Shewchuk's Triangle, which is free for
    # personal and research use but NOT for commercial distribution. It is fine
    # for this in-house platform; swap the mesher before any commercial release.
    #
    # It is also amd64-only in practice: the current release publishes a
    # manylinux x86_64 wheel and no source distribution that compiles on
    # Python 3.12 (the last sdist still includes longintrepr.h, dropped in
    # 3.12). The images are linux/amd64 anyway, so the marker keeps the
    # dependency install working on an arm64 dev machine; `mesh.py` imports it
    # lazily and the API answers 503 for solver calls when it is missing.
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "triangle>=20250106; platform_machine == 'x86_64'",
    # kiutils is VENDORED at platform/api/kiutils/ — it is the Wittmann-MEE fork
    # plus the manual KiCad-10 patch from the root CLAUDE.md (in_pos_files +
    # _unknown_fields catch-all). The upstream fork cannot parse KiCad-10-saved
    # symbols at all (raises on `(hide yes)`, `(duplicate_pin_numbers_are_jumpers)`,
    # `(in_pos_files)`); vendoring means Docker builds and reinstalls can never
    # lose the patch.
]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "kiutils*"]

[tool.setuptools.package-data]
# Jaravis's seed skill documents are read at import time via importlib path
# (app/seed_skills/*.md) — ship them in the non-editable Docker install too.
# Same for the KiCad sync plugin sources packaged by services/pcm.py.
app = ["seed_skills/*.md", "services/fieldsolver/data/*.json", "services/pcm_plugin/*"]
