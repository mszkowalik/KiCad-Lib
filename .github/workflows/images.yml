name: images

# Builds the three deployable images and pushes them to GHCR:
#   ghcr.io/<owner>/<repo>/api      FastAPI backend
#   ghcr.io/<owner>/<repo>/web      built SPA + nginx (also proxies the API)
#   ghcr.io/<owner>/<repo>/render   kicad-cli render service
#
# Pull requests build without pushing, so a broken Dockerfile fails before it
# reaches the registry.
#
# linux/amd64 only, on purpose: the render image's base (kicad/kicad) is
# published amd64-only, and the api image compiles LibreDWG from source, which
# under QEMU emulation takes tens of minutes. Add linux/arm64 to `platforms`
# below only for api + web, and only if a machine actually needs it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The render container runs its own copy of two files from api/app/services/.
  # api/CLAUDE.md requires them to stay byte-identical; without this gate a
  # divergence ships silently as two images that behave differently.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render/ duplicates match api/app/services/
        run: |
          rc=0
          for f in project_ops.py board_template.kicad_pcb; do
            if ! cmp -s "render/$f" "api/app/services/$f"; then
              echo "::error file=render/$f::render/$f and api/app/services/$f must stay byte-identical (api/CLAUDE.md)"
              diff -u "api/app/services/$f" "render/$f" || true
              rc=1
            fi
          done
          exit $rc

  build:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            target: ""
            cache: gha
          - name: web
            context: web
            target: prod
            cache: gha
          # The kicad base image is several GB, so a GHA cache entry would
          # thrash the 10 GB repo budget. Seeding from the last pushed image
          # instead lets buildx resolve every layer from the registry when
          # render/ has not changed.
          - name: render
            context: render
            target: ""
            cache: registry
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects upper-case names; this repo has them.
      - name: Resolve image name
        id: img
        run: |
          owner_repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner_repo}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the GHCR package list free of unknown/unknown entries.
          provenance: false
          # The :buildcache ref is a full (mode=max) registry cache that a
          # LOCAL machine can pull too — compose.yaml lists it in cache_from,
          # so a `docker system prune` never costs the LibreDWG compile again:
          # `docker compose up -d` resolves the layers from GHCR instead.
          # Empty lines in these lists are ignored by build-push-action.
          cache-from: |
            ${{ matrix.cache == 'gha' && format('type=gha,scope={0}', matrix.name) || '' }}
            type=registry,ref=${{ steps.img.outputs.ref }}:buildcache
            type=registry,ref=${{ steps.img.outputs.ref }}:latest
          cache-to: |
            ${{ matrix.cache == 'gha' && format('type=gha,scope={0},mode=max', matrix.name) || '' }}
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.img.outputs.ref) || '' }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
