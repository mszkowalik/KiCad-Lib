library_name: Resistor

# Default base component and standard package-to-footprint mapping.
# When importing a new component via LCSC, the importer uses these defaults
# so you only need to specify name + LCSC Part in the component entry.
defaults:
  base_component: R
  footprint_map:
    "0402": "7Sigma:R_0402_1005Metric"
    "0805": "7Sigma:R_0805_2012Metric"
    "1206": "7Sigma:R_1206_3216Metric"

# Validation rules specific to resistor components
validation_rules:
  required_properties:
    - "Value"
    - "Power"
    - "Tolerance"
    - "Footprint"
  non_empty_properties:
    - "Value"
    - "Power"
    - "Tolerance"
  property_patterns:
    "Value": "^[0-9]+(\\.[0-9]+)?[RKMkm][0-9]*$" # Resistance values like 22R, 5K1, 1M (suffix required)
    "Power": "^[0-9]+(\\.[0-9]+)?[mµnpkMGT]?W?$" # Power values like 63mW, 0.1W
    "Tolerance": "^[0-9]+(\\.[0-9]+)?%$" # Tolerance values like 1%, 5%

  footprint_style:
    pad_shape: roundrect         # SMD pads must use roundrect, not rect or oval
    pad_roundrect_rratio: 0.25  # rounded corner ratio for roundrect pads
    fab_line_width_mm: 0.1      # F.Fab body outline line width
    silk_line_width_mm: 0.1      # F.SilkS silkscreen line width
    crtyd_line_width_mm: 0.05  # F.CrtYd courtyard line width
    require_fab_outline: true   # must have at least one fp_line on F.Fab
    require_crtyd: true         # must have a closed F.CrtYd rectangle
    no_easyeda_prefix: true     # footprint header must not contain "easyeda2kicad:"
