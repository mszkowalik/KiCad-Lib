library_name: Connectors

# Validation rules specific to connector components
defaults:
  footprint_map:
    "P=3.5mm": "7Sigma:TerminalBlock_Plug_Invisible"
    "P=3.81mm": "7Sigma:TerminalBlock_Plug_Invisible"
    "SMD,P=0.4mm": "7Sigma:CONN-SMD_DF40C-100DS-0.4V-51"
    "SMD,P=0.5mm,Surface Mount,Right Angle": "7Sigma:FPC-SMD_AFC01-S22FCC-00"
  ignore_packages:
    - "-"
    - SMD
    - Through Hole
    - SMD,P=1.27mm
    - Through Hole,P=2.54mm
    - Through Hole,P=3.5mm
    - Through Hole,P=5.08mm
    - Through Hole,Right Angle
    - Through Hole,Right Angle,P=2.54mm
    - Through Hole,Right Angle,P=3.81mm
validation_rules:
  required_properties:
    - "ki_description"
    - "Footprint"
  non_empty_properties:
    - "ki_description"

  footprint_style:
    pad_shape: roundrect         # SMD pads must use roundrect, not rect or oval
    pad_roundrect_rratio: 0.25  # rounded corner ratio for roundrect pads
    fab_line_width_mm: 0.1      # F.Fab body outline line width
    silk_line_width_mm: 0.1      # F.SilkS silkscreen line width
    crtyd_line_width_mm: 0.05  # F.CrtYd courtyard line width
    require_fab_outline: true   # must have at least one fp_line on F.Fab
    require_crtyd: true         # must have a closed F.CrtYd rectangle
    no_easyeda_prefix: true     # footprint header must not contain "easyeda2kicad:"
